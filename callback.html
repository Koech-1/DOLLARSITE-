<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOLLARSITE - Authorization</title>
</head>

<body>

<h2>Authorizing DOLLARSITE...</h2>
<p id="status">Checking authorization...</p>

<script>
const status = document.getElementById("status");

const params =
    new URLSearchParams(window.location.search);

const code = params.get("code");
const returnedState = params.get("state");
const error = params.get("error");

const savedState =
    localStorage.getItem("oauth_state");

const codeVerifier =
    localStorage.getItem("pkce_code_verifier");

console.log("Returned state:", returnedState);
console.log("Saved state:", savedState);
console.log("Code:", code);
console.log("PKCE exists:", !!codeVerifier);

if (error) {

    status.textContent =
        "Deriv authorization failed: " + error;

} else if (!code) {

    status.textContent =
        "No authorization code received.";

} else if (!savedState) {

    status.textContent =
        "No saved OAuth session found. Please start login again.";

} else if (returnedState !== savedState) {

    status.textContent =
        "Security verification failed.";

} else if (!codeVerifier) {

    status.textContent =
        "PKCE verifier is missing.";

} else {

    status.textContent =
        "Authorization verified successfully!";

    console.log("Authorization code received.");
}
</script>

</body>
</html>
