<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOLLARSITE - Authorization</title>
</head>

<body>
    <h2>Authorizing DOLLARSITE...</h2>
    <p id="status">Checking authorization...</p>

    <script>
        const status = document.getElementById("status");

        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        const returnedState = params.get("state");
        const error = params.get("error");

        console.log("Callback URL:", window.location.href);
        console.log("Code:", code);
        console.log("Returned state:", returnedState);

        const savedState = sessionStorage.getItem("oauth_state");

        console.log("Saved state:", savedState);

        if (error) {
            status.textContent = "Deriv authorization failed: " + error;
        }
        else if (!code) {
            status.textContent = "No authorization code received.";
        }
        else if (!savedState) {
            status.textContent =
                "No saved login session found. Please start login again.";
        }
        else if (returnedState !== savedState) {
            status.textContent =
                "Security verification failed. State does not match.";
        }
        else {
            status.textContent =
                "Authorization verified successfully.";

            console.log("Authorization code:", code);

            // Temporary test
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1500);
        }
    </script>
</body>
</html>
