<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOLLARSITE - Authorization</title>
</head>

<body>

    <h2>Authorizing DOLLARSITE...</h2>

    <p id="status">
        Checking authorization...
    </p>


    <script>

        const status =
            document.getElementById("status");


        // ==========================================
        // GET DERIV CALLBACK PARAMETERS
        // ==========================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const code =
            params.get("code");

        const returnedState =
            params.get("state");

        const error =
            params.get("error");


        // ==========================================
        // GET SAVED PKCE INFORMATION
        // ==========================================

        const savedState =
            sessionStorage.getItem(
                "oauth_state"
            );

        const codeVerifier =
            sessionStorage.getItem(
                "pkce_code_verifier"
            );


        // ==========================================
        // DEBUG
        // ==========================================

        console.log(
            "Returned state:",
            returnedState
        );

        console.log(
            "Saved state:",
            savedState
        );

        console.log(
            "Code received:",
            !!code
        );

        console.log(
            "PKCE verifier exists:",
            !!codeVerifier
        );


        // ==========================================
        // ERROR CHECK
        // ==========================================

        if (error) {

            status.textContent =
                "Deriv authorization failed: " +
                error;

        }


        // ==========================================
        // CODE CHECK
        // ==========================================

        else if (!code) {

            status.textContent =
                "No authorization code received.";

        }


        // ==========================================
        // STATE CHECK
        // ==========================================

        else if (!savedState) {

            status.textContent =
                "No saved OAuth session found. Please start login again.";

        }


        else if (
            returnedState !== savedState
        ) {

            status.textContent =
                "Security verification failed.";

        }


        // ==========================================
        // PKCE CHECK
        // ==========================================

        else if (!codeVerifier) {

            status.textContent =
                "PKCE verifier is missing.";

        }


        // ==========================================
        // AUTHORIZATION VERIFIED
        // ==========================================

        else {

            status.textContent =
                "Authorization verified successfully!";

            console.log(
                "Authorization code received."
            );

            console.log(
                "Ready for secure token exchange."
            );

        }

    </script>

</body>

</html>
